          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        tagline:
          type: string
          maxLength: 200
        is_demo:
          type: boolean
