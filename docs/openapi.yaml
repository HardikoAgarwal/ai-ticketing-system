openapi: 3.0.3
info:
  title: Helpdesk AI API
  version: 1.0.0
  description: 'Multi-workspace helpdesk with AI triage and knowledge-grounded drafts.
    Authenticate via POST /api/v1/auth/login/ (or start a sandbox with POST /api/v1/demo/start/)
    and pass `Authorization: Bearer <access>`. Workspace resources live under /api/v1/w/<slug>/.'
paths:
  /api/v1/auth/accept-invite/:
    post:
      operationId: v1_auth_accept_invite_create
      summary: Accept a workspace invite by creating your account
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Log in with email and password; returns JWT pair and user profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      summary: Current authenticated user and their workspace memberships
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Exchange refresh token for a new access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      summary: Create an account and your own workspace (you become its owner)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/demo/start/:
    post:
      operationId: v1_demo_start_create
      summary: Spin up a private, pre-filled sandbox workspace; returns tokens for
        an agent view and a customer view
      tags:
      - Demo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoStartRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/demo/templates/:
    get:
      operationId: v1_demo_templates_retrieve
      summary: Available sandbox templates
      tags:
      - Demo
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/inbound/email/:
    post:
      operationId: v1_inbound_email_create
      summary: Create a ticket from an inbound email (shared-secret webhook)
      tags:
      - Channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InboundEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InboundEmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/w/{slug}/:
    get:
      operationId: v1_w_retrieve
      summary: Workspace settings and the caller's role
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    patch:
      operationId: v1_w_partial_update
      summary: Update name, tone, sign-off, SLA targets, AI toggle (owners/admins)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/w/{slug}/analytics/summary/:
    get:
      operationId: v1_w_analytics_summary_retrieve
      summary: 'Support analytics: volume, response times, SLA, AI accuracy, cost,
        satisfaction'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 7, 30 or 90 (default 30)
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/w/{slug}/articles/:
    get:
      operationId: v1_w_articles_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleList'
          description: ''
    post:
      operationId: v1_w_articles_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /api/v1/w/{slug}/articles/{id}/:
    get:
      operationId: v1_w_articles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this article.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    patch:
      operationId: v1_w_articles_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this article.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    delete:
      operationId: v1_w_articles_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this article.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/w/{slug}/articles/search/:
    get:
      operationId: v1_w_articles_search_list
      summary: Search the knowledge base (the same retrieval the AI drafts use)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Knowledge base
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KBHit'
          description: ''
  /api/v1/w/{slug}/categories/:
    get:
      operationId: v1_w_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: v1_w_categories_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/w/{slug}/categories/{id}/:
    get:
      operationId: v1_w_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: v1_w_categories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_w_categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/w/{slug}/invites/:
    get:
      operationId: v1_w_invites_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: v1_w_invites_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/w/{slug}/invites/{id}/:
    delete:
      operationId: v1_w_invites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invite.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/w/{slug}/macros/:
    get:
      operationId: v1_w_macros_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Macro'
          description: ''
    post:
      operationId: v1_w_macros_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MacroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MacroRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
          description: ''
  /api/v1/w/{slug}/macros/{id}/:
    get:
      operationId: v1_w_macros_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this macro.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
          description: ''
    patch:
      operationId: v1_w_macros_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this macro.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMacroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMacroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMacroRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
          description: ''
    delete:
      operationId: v1_w_macros_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this macro.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/w/{slug}/members/:
    get:
      operationId: v1_w_members_list
      description: |-
        Team directory. Staff see everyone; `?role=staff` limits it to assignable team members.

        Owners and admins can also manage the team: only an owner changes roles (Admin or Agent) and removes admins; an admin can remove agents.
        The owner and yourself are never changed or removed. Removing someone only ends their membership here: their open tickets go back to
        unassigned and their history stays.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberBrief'
          description: ''
  /api/v1/w/{slug}/members/{user_id}/:
    patch:
      operationId: v1_w_members_partial_update
      description: |-
        Team directory. Staff see everyone; `?role=staff` limits it to assignable team members.

        Owners and admins can also manage the team: only an owner changes roles (Admin or Agent) and removes admins; an admin can remove agents.
        The owner and yourself are never changed or removed. Removing someone only ends their membership here: their open tickets go back to
        unassigned and their history stays.
      summary: Change a team member's role to Admin or Agent (owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: v1_w_members_destroy
      description: |-
        Team directory. Staff see everyone; `?role=staff` limits it to assignable team members.

        Owners and admins can also manage the team: only an owner changes roles (Admin or Agent) and removes admins; an admin can remove agents.
        The owner and yourself are never changed or removed. Removing someone only ends their membership here: their open tickets go back to
        unassigned and their history stays.
      summary: Remove a team member from the workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/w/{slug}/records/:
    get:
      operationId: v1_w_records_list
      description: Requesters see their own items; staff can browse all (optionally
        `?owner=<user id>`).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Record'
          description: ''
  /api/v1/w/{slug}/records/{id}/:
    get:
      operationId: v1_w_records_retrieve
      description: Requesters see their own items; staff can browse all (optionally
        `?owner=<user id>`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this record.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
          description: ''
  /api/v1/w/{slug}/suggestions/:
    get:
