components:
  schemas:
    AIStatusEnum:
      enum:
      - IDLE
      - PENDING
      - COMPLETED
      - FAILED
      - DISABLED
      type: string
      description: |-
        * `IDLE` - Not started
        * `PENDING` - Pending
        * `COMPLETED` - Completed
        * `FAILED` - Failed
        * `DISABLED` - Disabled
    AIUsage:
      type: object
      properties:
        global_used:
          type: integer
        global_cap:
          type: integer
        workspace_used:
          type: integer
        workspace_cap:
          type: integer
      required:
      - global_cap
      - global_used
      - workspace_cap
      - workspace_used
    AcceptInviteRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        full_name:
          type: string
          minLength: 2
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
      required:
      - full_name
      - password
      - token
    ActionEnum:
      enum:
      - CREATED
      - AI_CLASSIFIED
      - AI_FAILED
      - STATUS_CHANGED
      - CATEGORY_CHANGED
      - PRIORITY_CHANGED
      - ASSIGNED
      - REPLIED
      - NOTE_ADDED
      - REQUESTER_REPLIED
      - REQUESTER_CONFIRMED
      - REQUESTER_REOPENED
      - CSAT_RECEIVED
      - AUTO_CLOSED
      type: string
      description: |-
        * `CREATED` - Ticket created
        * `AI_CLASSIFIED` - AI triaged
        * `AI_FAILED` - AI unavailable
        * `STATUS_CHANGED` - Status changed
        * `CATEGORY_CHANGED` - Category changed
        * `PRIORITY_CHANGED` - Priority changed
        * `ASSIGNED` - Assignment changed
        * `REPLIED` - Reply sent
        * `NOTE_ADDED` - Internal note added
        * `REQUESTER_REPLIED` - Requester replied
        * `REQUESTER_CONFIRMED` - Requester confirmed resolution
        * `REQUESTER_REOPENED` - Requester reopened
        * `CSAT_RECEIVED` - Satisfaction rating received
        * `AUTO_CLOSED` - Closed automatically
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        label:
          type: string
          readOnly: true
        from_value:
          type: string
          maxLength: 100
        to_value:
          type: string
          maxLength: 100
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - action
      - actor_name
      - id
      - label
    Article:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        body:
          type: string
        category:
          type: integer
          nullable: true
        is_published:
          type: boolean
        is_internal:
          type: boolean
          description: 'Staff-only: never shown to requesters or suggested to them'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - title
      - updated_at
    ArticleList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        is_published:
          type: boolean
        is_internal:
          type: boolean
          description: 'Staff-only: never shown to requesters or suggested to them'
        excerpt:
          type: string
          readOnly: true
        indexed:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - excerpt
      - id
      - indexed
      - title
      - updated_at
