        unread_kind:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/UnreadKindEnum'
          - $ref: '#/components/schemas/NullEnum'
        first_response_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        csat_score:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
        ai_reasoning:
          type: string
        ai_error:
          type: string
          maxLength: 255
        csat_comment:
          type: string
          maxLength: 500
        messages:
          type: array
          items:
            $ref: '#/components/schemas/StaffMessage'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          readOnly: true
        record_detail:
          allOf:
          - $ref: '#/components/schemas/Record'
          readOnly: true
        requester_profile:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - activities
      - ai_category
      - assigned_to
      - attachments
      - category
      - description
      - has_unread
      - id
      - messages
      - priority_label
      - record
      - record_detail
      - reference
      - requester
      - requester_profile
      - sla_state
      - status_label
      - subject
      - unread_kind
      - updated_at
    Suggestion:
      type: object
      properties:
        article_id:
          type: integer
        title:
          type: string
        excerpt:
          type: string
      required:
      - article_id
      - excerpt
      - title
    TemplateEnum:
      enum:
      - saas
      - helpdesk
      - ecommerce
      type: string
      description: |-
        * `saas` - saas
        * `helpdesk` - helpdesk
        * `ecommerce` - ecommerce
    TicketCreateRequest:
      type: object
      properties:
        record_id:
          type: integer
          nullable: true
          description: Omit or null for a general / account-level question.
        subject:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 20
          maxLength: 5000
        attachments:
          type: array
          items:
            type: string
            format: binary
      required:
      - description
      - subject
    TicketPriorityEnum:
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      type: string
      description: |-
        * `CRITICAL` - Critical
        * `HIGH` - High
        * `MEDIUM` - Medium
        * `LOW` - Low
    TicketStatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    UnreadKindEnum:
      enum:
      - new_ticket
      - requester_reply
      type: string
      description: |-
        * `new_ticket` - new_ticket
        * `requester_reply` - requester_reply
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        is_demo:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipRef'
          readOnly: true
      required:
      - email
      - full_name
      - id
      - memberships
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      - full_name
      - id
    Workspace:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        template:
          type: string
          readOnly: true
          description: Demo template key, if seeded from one
        tagline:
          type: string
          maxLength: 200
        agent_title:
          type: string
