        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          maxLength: 150
          minLength: 2
        team_size:
          type: string
          maxLength: 60
        message:
          type: string
          maxLength: 2000
          minLength: 10
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - email
      - full_name
      - message
    WorkspaceRequestRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        company:
          type: string
          minLength: 2
          maxLength: 150
        team_size:
          type: string
          maxLength: 60
        message:
