name: Keep API warm
# Free hosts put idle services to sleep (and Neon scales its database to zero). Pinging /health/
# every 10 minutes keeps the first visitor from waiting on a cold start. The health endpoint also
# re-dispatches any background AI jobs left over after a restart. Set the repository VARIABLE
# API_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://helpdesk-api.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --retry 3 --max-time 60 "${{ vars.API_URL }}/health/"
