name: Keep API warm
# OPTIONAL. Free hosts put idle services to sleep. The landing page already wakes the API when a
# visitor arrives, so you only need this if you want zero cold starts. /health/ never touches the
# database, so Neon still scales to zero and stays inside its free compute hours. Note: Render's
# free plan discourages artificial keep-alives and Koyeb's free instance sleeps after an hour
# regardless. Set the repository VARIABLE
# API_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://helpdesk-api.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --retry 3 --max-time 60 "${{ vars.API_URL }}/health/"
