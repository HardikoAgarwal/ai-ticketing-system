services:
  - type: web
    name: bookleaf-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bookleaf-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://bookleaf-portal.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false # empty for OpenAI; https://generativelanguage.googleapis.com/v1beta/openai/ for Gemini
      - key: AI_MODEL
        sync: false # gpt-4o-mini (OpenAI) or gemini-3.1-flash-lite (Gemini free tier)
      - key: AI_REASONING_EFFORT
        sync: false # empty for OpenAI; "none" for Gemini
      - key: AI_PRICE_INPUT_PER_M
        sync: false # 0 on Gemini's free tier
      - key: AI_PRICE_OUTPUT_PER_M
        sync: false
      - key: SEED_ON_START
        value: "true"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ADDRESSING_STYLE
        value: path

  - type: keyvalue
    name: bookleaf-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
