# Render blueprint: one free web service. The database is NOT created here: use Neon (free, no expiry)
# and paste its connection string as DATABASE_URL. Re-verify Render's current free-tier limits.
services:
  - type: web
    name: helpdesk-api
    runtime: python
    plan: free
    region: singapore # keep in the same region as the Neon database; cross-region round trips make every query slow
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon pooled or direct connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Cloudflare Pages URL, e.g. https://helpdesk-ai.pages.dev
      - key: OPENAI_API_KEY
        sync: false # Gemini key from AI Studio (free tier)
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_REASONING_EFFORT
        value: none
      - key: AI_EMBED_MODEL
        value: gemini-embedding-001
      - key: AI_PRICE_INPUT_PER_M
        value: "0"
      - key: AI_PRICE_OUTPUT_PER_M
        value: "0"
      - key: AI_DAILY_CALL_CAP
        value: "400"
      - key: AI_WORKSPACE_DAILY_CAP
        value: "40"
      - key: INBOUND_EMAIL_SECRET
        sync: false # optional; leave blank to disable the email webhook
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false # Supabase Storage bucket (optional)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ADDRESSING_STYLE
        value: path
